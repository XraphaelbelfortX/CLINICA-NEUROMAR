<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>NEUROMAR</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <header class="head">
    <a href="../html/index.html">
      <h1>NEUROMAR</h1>
    </a>
  </header>

  <div class="container">
    <section class="texthead">
      <h1>Faça o login</h1>
    </section>

    <form class="form" onsubmit="return false;">
      <label for="nome">Email</label>
      <input type="email" id="loginEmail" placeholder="Email" required>

      <label for="senha">Senha</label>
      <input type="password" id="loginSenha" placeholder="Digite sua senha" required>

      <button type="button" id="btnLogin">Login</button>
      <button type="button" id="btnEsqueceu">Esqueceu a senha?</button>
    </form>
  </div>

  <script type="module">
    import { login, esquecerSenha } from "../javascript/auth.js";

    document.getElementById("btnLogin").addEventListener("click", login);
    document.getElementById("btnEsqueceu").addEventListener("click", esquecerSenha);
  </script>
</body>
</html>
